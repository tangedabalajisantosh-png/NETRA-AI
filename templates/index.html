<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NETRA AI — Asteroid Monitor</title>

<style>
body{
    font-family: Arial;
    background:#0b0f1a;
    color:white;
    margin:0;
}

.mc-header{
    background:#111a2e;
    padding:20px;
    text-align:center;
}

.live-dot{
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
    display:inline-block;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:0.3;}
}

.status-bar{
    padding:15px;
    text-align:center;
    font-weight:bold;
}

.safe{background:green;}
.danger{background:red;}

.mc-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.mc-card{
    background:#111a2e;
    padding:20px;
    border-radius:10px;
}

.mc-footer{
    text-align:center;
    padding:20px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="mc-header">
    <h1>NETRA AI — MISSION CONTROL</h1>
    <p><span class="live-dot"></span> LIVE MONITORING</p>
</div>

<div id="status" class="status-bar">Loading...</div>

<div class="mc-grid">

<div class="mc-card">
<h3>OBJECT NAME</h3>
<p id="name">...</p>
</div>

<div class="mc-card">
<h3>MAGNITUDE</h3>
<p id="mag">...</p>
</div>

<div class="mc-card">
<h3>DIAMETER (KM)</h3>
<p id="diameter">...</p>
</div>

<div class="mc-card">
<h3>VELOCITY (KM/H)</h3>
<p id="velocity">...</p>
</div>

<div class="mc-card">
<h3>MISS DISTANCE (KM)</h3>
<p id="distance">...</p>
</div>

<div class="mc-card">
<h3>NASA LINK</h3>
<a id="link" href="#" target="_blank" style="color:cyan;">Open NASA Page</a>
</div>

</div>

<div class="mc-footer">
DATA SOURCE: NASA NEO API · SYSTEM: NETRA AI
</div>

<script>
const API_KEY="DEMO_KEY";

fetch(`https://api.nasa.gov/neo/rest/v1/feed?api_key=${API_KEY}`)
.then(res=>res.json())
.then(data=>{

const today=Object.keys(data.near_earth_objects)[0];
const asteroid=data.near_earth_objects[today][0];

document.getElementById("name").innerText=asteroid.name;
document.getElementById("mag").innerText=asteroid.absolute_magnitude_h;

const min=asteroid.estimated_diameter.kilometers.estimated_diameter_min.toFixed(3);
const max=asteroid.estimated_diameter.kilometers.estimated_diameter_max.toFixed(3);
document.getElementById("diameter").innerText=`${min} - ${max}`;

const approach=asteroid.close_approach_data[0];

document.getElementById("velocity").innerText=
Math.round(approach.relative_velocity.kilometers_per_hour);

document.getElementById("distance").innerText=
Math.round(approach.miss_distance.kilometers);

document.getElementById("link").href=asteroid.nasa_jpl_url;

const status=document.getElementById("status");

if(asteroid.is_potentially_hazardous_asteroid){
    status.className="status-bar danger";
    status.innerText="⚠️ POTENTIALLY HAZARDOUS";
}else{
    status.className="status-bar safe";
    status.innerText="✅ NO IMMEDIATE THREAT";
}

});
</script>

</body>
</html>
